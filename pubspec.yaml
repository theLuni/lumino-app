name: lumino
description: Lumino - desktop music player (Flutter port of the Electron app)
publish_to: 'none'
version: 0.3.4+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_libs_video: ^1.0.6
  smtc_windows: ^1.1.0
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  path_provider: ^2.1.5
  http: ^1.2.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  image: ^4.3.0
  path_drawing: ^1.0.1
  app_links: 7.2.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # smtc_windows 1.1.0's generated bindings require an exact runtime match.
  flutter_rust_bridge: 2.11.1

flutter:
  uses-material-design: false
  assets:
    - assets/logo.png
    - assets/icon.png
    - assets/icon.ico

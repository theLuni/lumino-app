<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumino</title>
<style>
  :root{--bg:#0b0b10;--dim:#2a2a35;--a:#ffffff;--b:#9a9aa8;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
       font-family:"Segoe UI",system-ui,sans-serif;animation:out .5s ease 2.7s forwards}
  .logo{width:64px;opacity:0;animation:pop .6s ease .1s forwards}
  .name{font-size:76px;font-weight:700;letter-spacing:.04em;
        background:linear-gradient(90deg,var(--a) 0%,var(--b) 50%,var(--dim) 50%,var(--dim) 100%);
        background-size:200% 100%;background-position:100% 0;
        -webkit-background-clip:text;background-clip:text;color:transparent;
        animation:fill 1.5s cubic-bezier(.4,0,.2,1) .3s forwards}
  .by{position:fixed;left:0;right:0;bottom:28px;display:flex;align-items:center;justify-content:center;gap:12px;opacity:0;transform:translateY(24px);filter:blur(6px);animation:rise .9s ease 1.5s forwards}
  .bars{display:flex;align-items:center;gap:5px;height:26px}
  .bars i{display:block;width:4px;border-radius:3px;background:#7aa7e6;box-shadow:0 0 8px rgba(122,167,230,.55)}
  .bars i:nth-child(1),.bars i:nth-child(3){height:11px}
  .bars i:nth-child(2){height:26px}
  .fid{font-size:19px;font-weight:700;color:#8b8b95;letter-spacing:.01em}
  .fid b{font-weight:700}
  @keyframes fill{to{background-position:0 0}}
  @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
  @keyframes rise{to{opacity:1;transform:none;filter:none}}
  @keyframes out{to{opacity:0}}
</style>
